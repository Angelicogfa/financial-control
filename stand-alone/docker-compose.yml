# Stand-alone stack: runs Financial Control from the images published on the GitHub
# Container Registry, without cloning the repository or building anything.
#   cp .env.sample .env      # then edit .env (see README.md)
#   docker compose up -d
#
# Only the web app is published; database, cache and API stay on the internal network.
# The api, worker and migrate services share the api image.

name: fincontrol

x-app: &app
  image: ghcr.io/angelicogfa/finance-controle-api:${FINCONTROL_VERSION:-latest}
  env_file:
    - .env
  environment:
    # Built from the container credentials so they can never drift apart.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - fincontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - fincontrol_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    working_dir: /app/apps/api
    command: ["python", "-m", "worker.scheduler"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/angelicogfa/finance-controle-web:${FINCONTROL_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fincontrol_pgdata:
    name: ${PGDATA_VOLUME:-fincontrol_pgdata}
  fincontrol_redisdata:
    name: ${REDISDATA_VOLUME:-fincontrol_redisdata}
