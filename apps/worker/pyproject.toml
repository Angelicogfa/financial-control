[project]
name = "fincontrol-worker"
version = "0.1.0"
description = "APScheduler background worker for quotes, BCB series, and daily portfolio snapshots"
requires-python = ">=3.12"
dependencies = [
    "fincontrol-core",
    "fincontrol-persistence",
    "apscheduler>=3.10",
]

[tool.uv.sources]
fincontrol-core = { workspace = true }
fincontrol-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincontrol_worker"]
