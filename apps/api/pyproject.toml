[project]
name = "fincontrol-api"
version = "0.1.0"
description = "FastAPI HTTP backend for Financial Control"
requires-python = ">=3.12"
dependencies = [
    "fincontrol-config",
    "fincontrol-core",
    "fincontrol-persistence",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[tool.uv.sources]
fincontrol-config = { workspace = true }
fincontrol-core = { workspace = true }
fincontrol-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincontrol_api"]
