[project]
name = "fincontrol-api"
version = "0.1.0"
description = "Unified backend (API, domain, infrastructure, migrations, and worker) for Financial Control"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "redis>=5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controllers", "domain", "infra", "core", "worker"]
py-modules = ["main", "composition", "cli"]
