# Local debugging overlay: publishes Postgres, Redis and the API on the loopback interface
# only, so they are never reachable from the network.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
