[project]
name = "fincontrol-core"
version = "0.1.0"
description = "Pure domain logic for ARCA allocation, optional Cerrado scoring, fixed income, earnings, consolidation, and analytics"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincontrol_core"]
