[project]
name = "fincontrol-persistence"
version = "0.1.0"
description = "SQLAlchemy 2.0 models, Alembic migrations (script_#####), and paginated repositories"
requires-python = ">=3.12"
dependencies = [
    "fincontrol-core",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
fincontrol-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincontrol_persistence"]
