[project]
name = "fincontrol-config"
version = "0.1.0"
description = "Typed environment settings shared by the API and the worker"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincontrol_config"]
