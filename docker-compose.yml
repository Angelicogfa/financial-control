# Development stack: the production services (docker-compose.prod.yml) plus Postgres, Redis
# and the API published on the loopback interface, so local tools can reach them while they
# stay invisible to the network.
#   docker compose up -d --build
#
# Same volumes as production (fincontrol_pgdata / fincontrol_redisdata): switching between
# the two files keeps the data.

x-prod: &prod
  file: docker-compose.prod.yml

services:
  postgres:
    extends:
      <<: *prod
      service: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  redis:
    extends:
      <<: *prod
      service: redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"

  migrate:
    extends:
      <<: *prod
      service: migrate

  api:
    extends:
      <<: *prod
      service: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    extends:
      <<: *prod
      service: worker

  web:
    extends:
      <<: *prod
      service: web

volumes:
  fincontrol_pgdata:
    name: ${PGDATA_VOLUME:-fincontrol_pgdata}
  fincontrol_redisdata:
    name: ${REDISDATA_VOLUME:-fincontrol_redisdata}
