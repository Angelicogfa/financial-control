# Creates the next release tag (vX.Y.Z) on the tip of main and publishes its images.
# Pick the part of the version to bump: major (X), minor (Y) or patch (Z). The first release
# starts from v0.0.0.
name: Create release tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: create-release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Create ${{ inputs.bump }} tag from main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          current=${current:-v0.0.0}
          IFS=. read -r major minor patch <<< "${current#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"

          existing=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -n "$existing" ]]; then
            echo "::error::The tip of main is already released as ${existing//$'\n'/, }."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$next" > /dev/null; then
            echo "::error::Tag $next already exists."
            exit 1
          fi

          echo "Current release: $current -> next release: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

  images:
    name: Publish images
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
