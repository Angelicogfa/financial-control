# Runs the same local quality gate as scripts/check.sh. GitHub Actions minutes are not
# currently available for this repository, so the gate is executed locally (manually or via
# the pre-push hook from scripts/install-hooks.sh); this workflow is kept for when they are.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Lint, tests, build and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Run local quality gate with smoke test
        run: scripts/check.sh --smoke
