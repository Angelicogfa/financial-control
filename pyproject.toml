[project]
name = "financial-control-workspace"
version = "0.1.0"
description = "Personal investment management monorepo (ARCA + Diagrama do Cerrado)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI uses Depends() in default arguments

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = [
    "apps/api/tests",
]
addopts = "-ra -q"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
