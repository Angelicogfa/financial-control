# Virtual root of the uv workspace (Python monorepo).
# Each package and app defines its own pyproject.toml.
[tool.uv.workspace]
members = ["apps/packages/*", "apps/api", "apps/worker"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"] # FastAPI uses Depends() in default arguments

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
markers = [
    "unit: fast isolated unit tests without external I/O",
    "integration: integration tests verifying persistence, migrations, and service boundaries",
]
testpaths = [
    "apps/packages/config/tests",
    "apps/packages/core/tests",
    "apps/packages/persistence/tests",
    "apps/api/tests",
    "apps/worker/tests",
]
